<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Sapna Saree Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .modal {
            transition: opacity 0.25s ease;
        }

        body.modal-active {
            overflow-x: hidden;
            overflow-y: hidden !important;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">

    <!-- Auth Check -->
    <script>
        if (!sessionStorage.getItem('isAdmin')) {
            window.location.href = 'admin-login.html';
        }
        function logout() {
            sessionStorage.removeItem('isAdmin');
            window.location.href = 'index.html';
        }
    </script>

    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-2 brand-logo-container">
                    <div class="w-8 h-8 bg-black flex items-center justify-center rounded-full">
                        <span class="text-white font-bold text-lg">S</span>
                    </div>
                    <span class="text-xl font-bold tracking-tighter">Admin Dashboard</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-sm font-medium hover:text-[#D4AF37]">View Site</a>
                    <button onclick="logout()"
                        class="text-sm font-medium text-red-500 hover:text-red-700">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">

        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold">Product Management</h1>
                <p class="text-gray-500">Manage your inventory, prices, and categories.</p>
            </div>
            <button onclick="openModal()"
                class="bg-black text-white px-6 py-3 rounded-xl font-bold flex items-center space-x-2 hover:bg-[#D4AF37] transition">
                <i data-lucide="plus" class="w-5 h-5"></i>
                <span>Add Product</span>
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Product</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Category</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Original Price</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Selling Price</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Image
                        </th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" id="admin-product-list">
                    <!-- Products rendered via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Company Info Management Section -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 border-t border-gray-200">
        <h2 class="text-3xl font-bold mb-8">Company Interface</h2>

        <form id="companyInfoForm" class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
            <!-- Branding Section -->
            <div class="mb-8 p-6 bg-gray-50 rounded-2xl border border-gray-100">
                <h3 class="text-xl font-bold mb-4 text-[#D4AF37]">Brand Identity</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-bold mb-1">Company Name</label>
                        <input type="text" id="ci-companyName" class="w-full border rounded-xl p-3 bg-white"
                            placeholder="SAPNA">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">Highlight Word</label>
                        <input type="text" id="ci-companyHighlight" class="w-full border rounded-xl p-3 bg-white"
                            placeholder="SAREE">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">Logo Image URL</label>
                        <input type="url" id="ci-logoUrl" class="w-full border rounded-xl p-3 bg-white"
                            placeholder="Leave empty for Text Logo">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- About Us Section -->
                <div>
                    <h3 class="text-xl font-bold mb-6 text-[#D4AF37]">About Us Content</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">Main Heading</label>
                            <input type="text" id="ci-aboutTitle" class="w-full border rounded-xl p-3 bg-gray-50">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Short Description (Hero)</label>
                            <textarea id="ci-aboutDesc" rows="3"
                                class="w-full border rounded-xl p-3 bg-gray-50"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Full Story</label>
                            <textarea id="ci-aboutLongDesc" rows="4"
                                class="w-full border rounded-xl p-3 bg-gray-50"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold mb-1">Experience (e.g. 25+)</label>
                                <input type="text" id="ci-experienceYears"
                                    class="w-full border rounded-xl p-3 bg-gray-50">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-1">Customers (e.g. 50k+)</label>
                                <input type="text" id="ci-customerCount"
                                    class="w-full border rounded-xl p-3 bg-gray-50">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Contact Details Section -->
                <div>
                    <h3 class="text-xl font-bold mb-6 text-[#D4AF37]">Contact Details</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">Address</label>
                            <textarea id="ci-address" rows="3"
                                class="w-full border rounded-xl p-3 bg-gray-50"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold mb-1">Phone 1</label>
                                <input type="text" id="ci-phone1" class="w-full border rounded-xl p-3 bg-gray-50">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-1">Phone 2</label>
                                <input type="text" id="ci-phone2" class="w-full border rounded-xl p-3 bg-gray-50">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold mb-1">Email 1</label>
                                <input type="email" id="ci-email1" class="w-full border rounded-xl p-3 bg-gray-50">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-1">Email 2</label>
                                <input type="email" id="ci-email2" class="w-full border rounded-xl p-3 bg-gray-50">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex justify-end">
                <button type="submit"
                    class="bg-black text-white px-8 py-4 rounded-xl font-bold hover:bg-[#D4AF37] transition shadow-lg">
                    Save Company Info
                </button>
            </div>
        </form>
    </div>

    <!-- Modal -->
    <div id="productModal"
        class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-black opacity-50"></div>

        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-3xl shadow-lg z-50 overflow-y-auto">
            <div class="modal-content py-4 text-left px-6">
                <!-- Title -->
                <div class="flex justify-between items-center pb-3">
                    <p class="text-2xl font-bold" id="modalTitle">Add Product</p>
                    <button class="modal-close z-50 p-2 hover:bg-gray-100 rounded-full cursor-pointer"
                        onclick="closeModal()">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>

                <!-- Form -->
                <form id="productForm" class="space-y-4">
                    <input type="hidden" id="editId">

                    <div>
                        <label class="block text-sm font-bold mb-1">Product Name</label>
                        <input type="text" id="pName" class="w-full border rounded-xl p-3 bg-gray-50" required>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">Category</label>
                            <select id="pCategory" class="w-full border rounded-xl p-3 bg-gray-50">
                                <option value="saree">Sarees</option>
                                <option value="shoe">Shoes</option>
                                <option value="dress">Dresses</option>
                                <option value="jacket">Jackets</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Badge (Optional)</label>
                            <input type="text" id="pBadge" class="w-full border rounded-xl p-3 bg-gray-50"
                                placeholder="e.g. New">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">Original Price (LKR)</label>
                            <input type="number" id="pOriginalPrice" class="w-full border rounded-xl p-3 bg-gray-50"
                                required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Selling Price (LKR)</label>
                            <input type="number" id="pSellingPrice" class="w-full border rounded-xl p-3 bg-gray-50"
                                required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold mb-1">Image URL</label>
                        <input type="url" id="pImage" class="w-full border rounded-xl p-3 bg-gray-50"
                            placeholder="https://..." required>
                        <p class="text-xs text-gray-400 mt-1">Paste a direct image link.</p>
                    </div>

                    <div class="flex justify-end pt-4">
                        <button type="submit"
                            class="px-6 py-3 bg-black text-white font-bold rounded-xl hover:bg-[#D4AF37] w-full transition">Save
                            Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script>
        lucide.createIcons();

        function renderAdminTable() {
            const products = getProducts();
            const tbody = document.getElementById('admin-product-list');
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${p.name}</div>
                        ${p.badge ? `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">${p.badge}</span>` : ''}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 capitalize">${p.category}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">LKR ${p.originalPrice.toLocaleString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">LKR ${p.sellingPrice.toLocaleString()}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <img src="${p.image}" class="h-10 w-10 rounded-full object-cover border border-gray-200" alt="">
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="editItem(${p.id})" class="text-indigo-600 hover:text-indigo-900 mr-4">Edit</button>
                        <button onclick="deleteItem(${p.id})" class="text-red-600 hover:text-red-900">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function deleteItem(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                deleteProduct(id);
                renderAdminTable();
            }
        }

        // Modal Logic
        const modal = document.getElementById('productModal');
        const form = document.getElementById('productForm');

        function openModal(isEdit = false) {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
            document.getElementById('modalTitle').textContent = isEdit ? 'Edit Product' : 'Add Product';
            if (!isEdit) {
                form.reset();
                document.getElementById('editId').value = '';
            }
        }

        function closeModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        function editItem(id) {
            const products = getProducts();
            const p = products.find(x => x.id === id);
            if (p) {
                document.getElementById('editId').value = p.id;
                document.getElementById('pName').value = p.name;
                document.getElementById('pCategory').value = p.category;
                document.getElementById('pOriginalPrice').value = p.originalPrice;
                document.getElementById('pSellingPrice').value = p.sellingPrice;
                document.getElementById('pImage').value = p.image;
                document.getElementById('pBadge').value = p.badge || '';
                openModal(true);
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const product = {
                id: document.getElementById('editId').value ? parseInt(document.getElementById('editId').value) : null,
                name: document.getElementById('pName').value,
                category: document.getElementById('pCategory').value,
                originalPrice: parseInt(document.getElementById('pOriginalPrice').value),
                sellingPrice: parseInt(document.getElementById('pSellingPrice').value),
                image: document.getElementById('pImage').value,
                badge: document.getElementById('pBadge').value || null
            };

            if (product.id) {
                updateProduct(product);
            } else {
                addProduct(product);
            }

            closeModal();
            renderAdminTable();
        });

        // Initialize
        renderAdminTable();
        loadCompanyInfoToForm();

        // Company Info Logic
        function loadCompanyInfoToForm() {
            const info = getCompanyInfo();
            document.getElementById('ci-companyName').value = info.companyName;
            document.getElementById('ci-companyHighlight').value = info.companyHighlight;
            document.getElementById('ci-logoUrl').value = info.logoUrl;

            document.getElementById('ci-aboutTitle').value = info.aboutTitle;
            document.getElementById('ci-aboutDesc').value = info.aboutDesc;
            document.getElementById('ci-aboutLongDesc').value = info.aboutLongDesc;
            document.getElementById('ci-experienceYears').value = info.experienceYears;
            document.getElementById('ci-customerCount').value = info.customerCount;

            document.getElementById('ci-address').value = info.address;
            document.getElementById('ci-phone1').value = info.phone1;
            document.getElementById('ci-phone2').value = info.phone2;
            document.getElementById('ci-email1').value = info.email1;
            document.getElementById('ci-email2').value = info.email2;
        }

        document.getElementById('companyInfoForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const info = {
                companyName: document.getElementById('ci-companyName').value,
                companyHighlight: document.getElementById('ci-companyHighlight').value,
                logoUrl: document.getElementById('ci-logoUrl').value,

                aboutTitle: document.getElementById('ci-aboutTitle').value,
                aboutDesc: document.getElementById('ci-aboutDesc').value,
                aboutLongDesc: document.getElementById('ci-aboutLongDesc').value,
                experienceYears: document.getElementById('ci-experienceYears').value,
                customerCount: document.getElementById('ci-customerCount').value,
                address: document.getElementById('ci-address').value,
                phone1: document.getElementById('ci-phone1').value,
                phone2: document.getElementById('ci-phone2').value,
                email1: document.getElementById('ci-email1').value,
                email2: document.getElementById('ci-email2').value
            };
            saveCompanyInfo(info);
            alert('Company Information Updated Successfully!');
            renderCompanyInfo(); // Update current page logo immediately
        });
    </script>
</body>

</html>
