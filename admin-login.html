<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Sapna Saree Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex items-center justify-center h-screen">

    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-black flex items-center justify-center rounded-full mx-auto mb-4">
                <span class="text-white font-bold text-3xl">S</span>
            </div>
            <h1 class="text-2xl font-bold">Admin Login</h1>
            <p class="text-gray-500">Sapna Saree Center</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-bold mb-2">Username</label>
                <input type="text" id="username"
                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-black transition"
                    placeholder="Enter username">
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Password</label>
                <input type="password" id="password"
                    class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-black transition"
                    placeholder="Enter password">
            </div>
            <button type="submit"
                class="w-full bg-black text-white py-3 rounded-xl font-bold hover:bg-[#D4AF37] transition duration-300">
                Login
            </button>
        </form>
        <p id="errorMsg" class="mt-4 text-center text-red-500 text-sm hidden">Invalid Credentials</p>
        <p class="mt-8 text-center text-gray-400 text-xs">Default: admin / admin123</p>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            if (u === 'admin' && p === 'admin123') {
                sessionStorage.setItem('isAdmin', 'true');
                window.location.href = 'admin-dashboard.html';
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
